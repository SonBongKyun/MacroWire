# Background ingestion/Discord worker only.
# The MacroWire web app and API are deployed from main to Vercel.
services:
  - type: worker
    name: macrowire-wire-worker
    runtime: node
    buildCommand: npm ci
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run worker:wire
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_ALERT_SOURCE_TIERS
        value: "T0,T1"
      - key: DISCORD_ALERT_MIN_SCORE
        value: "55"
      - key: DISCORD_ALERT_MAX_AGE_MINUTES
        value: "30"
      - key: DISCORD_ALERT_MAX_ARTICLES
        value: "5"
      - key: WIRE_WORKER_CONCURRENCY
        value: "4"
      - key: WIRE_LOOP_INTERVAL_MS
        value: "1000"
