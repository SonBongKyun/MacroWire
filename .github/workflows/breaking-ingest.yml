name: breaking-ingest-fallback

on:
  schedule:
    # Safety net only. The Render long-running worker is the primary ingest
    # path; GitHub schedules can be delayed and do not provide wire latency.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: breaking-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run T0/T1 fallback ingest directly against Neon
        run: npx tsx scripts/breaking-once.ts
