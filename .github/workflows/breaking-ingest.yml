name: breaking-ingest

on:
  schedule:
    # Best-effort five-minute schedule. GitHub may delay scheduled runs
    # substantially during periods of high demand.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: breaking-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run breaking ingest directly against Neon
        run: npx tsx scripts/breaking-once.ts
