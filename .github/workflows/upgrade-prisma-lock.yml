name: upgrade-prisma-lock

on:
  push:
    branches: [upgrade/production-v2-20260826]
    paths:
      - ".github/workflows/upgrade-prisma-lock.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/production-v2-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Upgrade Prisma within the compatibility-safe major
        run: npm install --save-exact @prisma/client@6.19.3 prisma@6.19.3 --package-lock-only
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): upgrade Prisma to 6.19.3"
          git fetch origin upgrade/production-v2-20260826
          git rebase origin/upgrade/production-v2-20260826
          git push origin HEAD:upgrade/production-v2-20260826
