name: audit-runtime

on:
  push:
    branches: [upgrade/production-v2-20260826]
    paths:
      - ".github/workflows/audit-runtime.yml"

permissions:
  contents: read

jobs:
  runtime-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install production tree only
        run: npm ci --omit=dev --ignore-scripts
      - name: Inspect suspected advisory path
        run: |
          echo "--- production dependency tree ---"
          npm ls --omit=dev prisma @prisma/config deepmerge-ts || true
          echo "--- installed package directories ---"
          for p in prisma @prisma/config deepmerge-ts; do
            if [ -d "node_modules/$p" ]; then echo "$p PRESENT"; else echo "$p ABSENT"; fi
          done
