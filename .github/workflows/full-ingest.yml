name: full-ingest

on:
  push:
    branches: [ops/one-shot-ingest-20260826]
    paths:
      - ".github/workflows/full-ingest.yml"
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch: {}

concurrency:
  group: full-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full ingest directly against Neon
        run: npx tsx scripts/ingest-once.ts
